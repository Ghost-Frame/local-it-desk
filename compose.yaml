name: local-it-desk

services:
  app:
    image: "${LOCAL_IT_DESK_IMAGE:-docker.io/ghostframe/local-it-desk:0.1.0}"
    pull_policy: missing
    user: "10001:10001"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_NAME: "${APP_NAME:-Local IT Desk}"
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:8080}"
      SUPPORT_CONTACT: "${SUPPORT_CONTACT:-}"
      COOKIE_SECURE: "false"
      LISTEN_ADDR: "0.0.0.0:3000"
      DATABASE_PATH: "/state/current/data/local-it-desk.db"
      UPLOAD_DIR: "/state/current/attachments"
      BRANDING_DIR: "/state/current/branding"
      SERVE_FRONTEND: "true"
      FRONTEND_DIR: "/app/frontend"
      SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-14}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-26214400}"
      MAX_TICKET_UPLOAD_BYTES: "${MAX_TICKET_UPLOAD_BYTES:-104857600}"
      MAX_ROSTER_BYTES: "${MAX_ROSTER_BYTES:-1048576}"
      MAX_ROSTER_ROWS: "${MAX_ROSTER_ROWS:-500}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - desk-state:/state
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    healthcheck:
      test: ["CMD", "/app/local-it-desk-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - desk-internal

  caddy:
    image: "${CADDY_IMAGE:-caddy:2.10.0-alpine}"
    pull_policy: missing
    command:
      - caddy
      - reverse-proxy
      - --from
      - :8080
      - --to
      - http://app:3000
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
        restart: true
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    ports:
      - name: evaluation-http
        target: 8080
        published: "${HTTP_PORT:-8080}"
        host_ip: "${HTTP_BIND_ADDRESS:-0.0.0.0}"
        protocol: tcp
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=50331648,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      desk-internal: {}
      desk-ingress:
        gw_priority: 1

volumes:
  desk-state:

networks:
  desk-internal:
    internal: true
  desk-ingress:
