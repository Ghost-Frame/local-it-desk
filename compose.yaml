name: local-it-desk

services:
  app:
    image: "${LOCAL_IT_DESK_IMAGE:-local-it-desk:0.1.0}"
    pull_policy: missing
    user: "10001:10001"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_NAME: "${APP_NAME:-Local IT Desk}"
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:8080}"
      SUPPORT_CONTACT: "${SUPPORT_CONTACT:-}"
      COOKIE_SECURE: "false"
      LISTEN_ADDR: "0.0.0.0:3000"
      DATABASE_PATH: "/data/local-it-desk.db"
      UPLOAD_DIR: "/attachments"
      BRANDING_DIR: "/branding"
      SERVE_FRONTEND: "true"
      FRONTEND_DIR: "/app/frontend"
      SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-14}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-26214400}"
      MAX_TICKET_UPLOAD_BYTES: "${MAX_TICKET_UPLOAD_BYTES:-104857600}"
      MAX_ROSTER_BYTES: "${MAX_ROSTER_BYTES:-1048576}"
      MAX_ROSTER_ROWS: "${MAX_ROSTER_ROWS:-500}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - name: evaluation-http
        target: 3000
        published: "${HTTP_PORT:-8080}"
        host_ip: "${HTTP_BIND_ADDRESS:-0.0.0.0}"
        protocol: tcp
    volumes:
      - desk-data:/data
      - desk-attachments:/attachments
      - desk-branding:/branding
      - desk-backups:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    healthcheck:
      test: ["CMD", "/app/local-it-desk-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - desk-internal

volumes:
  desk-data:
  desk-attachments:
  desk-branding:
  desk-backups:

networks:
  desk-internal:
    internal: true
