services:
  app:
    environment:
      APP_ORIGIN: "${HTTPS_ORIGIN:-https://helpdesk.local}"
      COOKIE_SECURE: "true"

  caddy:
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    ports: !override
      - name: school-https
        target: 8443
        published: "${HTTPS_PORT:-443}"
        host_ip: "${HTTPS_BIND_ADDRESS:-0.0.0.0}"
        protocol: tcp
    volumes:
      - type: bind
        source: ./deploy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ./certs
        target: /certs
        read_only: true
