name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Reject compiler and Clippy warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@cf03a9b516e09bc5a90f041fc26fc930c9dc631b # v1.0.0
        with:
          version: 11.18.0
          runtime: node@24.18.1
          install: false
          cache: false
      - name: Install frozen dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Run frontend checks
        run: pnpm --dir frontend check
      - name: Audit production dependencies
        run: pnpm --dir frontend audit --prod --audit-level high

  policy:
    name: Security and release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@cf03a9b516e09bc5a90f041fc26fc930c9dc631b # v1.0.0
        with:
          version: 11.18.0
          runtime: node@24.18.1
          install: false
          cache: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: caddy/go.sum
      - name: Install pinned package tools
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo install cargo-audit --locked --version 0.22.2
          pnpm --dir frontend install --frozen-lockfile
      - name: Run dependency audits
        run: |
          cargo audit --deny warnings
          (cd caddy && GOFLAGS='-tags=nobadger,nomysql,nopgx' go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...)
      - name: Run source and dependency boundaries
        run: |
          bash scripts/check-dependencies.sh
          bash scripts/check-history.sh
          bash scripts/check-forbidden-surfaces.sh
          bash scripts/check-private-terms.sh
          bash scripts/check-release-rights.sh
      - name: Run deployment and documentation contracts
        env:
          CONTAINER_ENGINE: docker
        run: |
          bash scripts/compose-contract.sh
          bash scripts/check-runbook.sh
      - name: Check shell scripts
        run: |
          find scripts tests/e2e/local-only -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck
      - name: Scan committed source for secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: 1
          hide-progress: true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container and HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify runtime contract
        run: |
          bash scripts/container-contract.sh
          bash scripts/check-image.sh local-it-desk:verify
      - name: Verify rendered Compose profiles
        run: bash scripts/compose-contract.sh
      - name: Exercise isolated HTTPS profile
        run: bash scripts/https-smoke.sh
      - name: Exercise backup, update, restore, and rollback
        run: bash scripts/smoke-compose.sh
      - name: Scan exact release image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.73.0
          image-ref: local-it-desk:verify
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          hide-progress: true

  ci:
    name: ci
    if: always()
    needs: [rust, frontend, policy, secret-scan, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "${RUST_RESULT}" = success
          test "${FRONTEND_RESULT}" = success
          test "${POLICY_RESULT}" = success
          test "${SECRET_SCAN_RESULT}" = success
          test "${CONTAINER_RESULT}" = success
